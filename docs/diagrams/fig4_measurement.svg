<text x="556" y="180" font-size="11" text-anchor="start">A status field is one component's claim about itself.</text>
<path d="M107,232 L107,258 L807,258 L807,232" fill="none" stroke="#000" stroke-width="1.8"/>
<line x1="107.0" y1="232.0" x2="107.0" y2="215.0" stroke="#000" stroke-width="1.6"/>
