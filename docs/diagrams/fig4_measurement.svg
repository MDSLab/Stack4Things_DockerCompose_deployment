<text x="457" y="282" font-size="12" text-anchor="middle" font-weight="bold">DELIVERY TEST: put a known message in one end, look for it at the other</text>
<text x="457" y="300" font-size="11" text-anchor="middle">The only check that cannot lie, because it observes the result instead of a report about the result.</text>
<rect x="30" y="320" width="860" height="58" fill="#ededed" stroke="#000" stroke-width="1.6"/>
<text x="46" y="341" font-size="12" text-anchor="start" font-weight="bold">Five faults hid behind a healthy looking signal:</text>
<text x="46" y="359" font-size="11" text-anchor="start">a connection said open while it could not deliver, a queue was acknowledged after conversion failed, a health check</text>
<text x="46" y="374" font-size="11" text-anchor="start">passed on a session subscribed to nothing, a wait passed on the wrong service, and a suite passed on an empty system.</text>
