#
# CORS header support. Vendored verbatim from eclipse-ditto/ditto.
#
# As of Nginx 1.7.5, add_header supports an "always" parameter which
# allows CORS to work if the backend returns 4xx or 5xx status code.
#
# PRODUCTION NOTE: as written this reflects any Origin back, which is
# permissive. On the factory server, restrict it by uncommenting one of the
# allow-list blocks below and removing the unconditional assignment.
#

set $cors $http_origin;

# Allow-listed origins, enforces https for those
#if ($http_origin ~ '^https://twin\.your-factory\.example(:\d+)?$') {
#  set $cors $http_origin;
#}
# Allows http for localhost on any port
#if ($http_origin ~ '^http://(localhost|127\.0\.0\.1)(:\d+)?') {
#  set $cors $http_origin;
#}

if ($cors != "") {
  add_header 'Access-Control-Allow-Origin' '$cors' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
  add_header 'Access-Control-Allow-Credentials' 'true' always;
  add_header 'Access-Control-Allow-Headers' '$http_access_control_request_headers' always;
  add_header 'Access-Control-Expose-Headers' 'correlation-id, response-required, dry-run, channel, etag, ditto-originator, requested-acks, timeout, location, ditto-metadata, traceparent, tracestate, entity-revision' always;
}

if ($request_method = 'OPTIONS') {
  add_header 'Access-Control-Max-Age' 1728000;
  add_header 'Access-Control-Allow-Origin' '$cors' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
  add_header 'Access-Control-Allow-Credentials' 'true' always;
  add_header 'Access-Control-Allow-Headers' '$http_access_control_request_headers' always;
  add_header 'Access-Control-Expose-Headers' 'correlation-id, response-required, dry-run, channel, etag, ditto-originator, requested-acks, timeout, location, ditto-metadata, traceparent, tracestate, entity-revision' always;
  add_header 'Content-Type' 'text/plain charset=UTF-8';
  add_header 'Content-Length' 0;
  return 204;
}
